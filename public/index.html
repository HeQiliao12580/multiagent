<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent 聊天室</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1c1f23;
    --muted: #6b7280;
    --accent: #2f6feb;
    --user: #e8f0fe;
    --agent: #ffffff;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  /* 多房间改造（阶段 4）：房间切换器 */
  .rooms { display: flex; align-items: center; gap: 6px; }
  #roomSelect {
    font: inherit;
    font-size: 13px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    max-width: 220px;
  }
  #roomSelect:focus { outline: 2px solid rgba(47, 111, 235, .35); }
  .mini {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fafbfc;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .mini.danger:hover { border-color: var(--err); color: var(--err); }
  .mini:disabled { opacity: .4; cursor: default; }
  .mini:disabled:hover { border-color: var(--border); color: var(--muted); }
  .agents { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border);
    background: #fafbfc;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.busy { background: #fff7e6; border-color: #f0c36d; color: #8a6100; cursor: default; }
  .chip.err { background: #fdecea; border-color: #e6a99f; color: var(--err); cursor: default; }
  .conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9ced6; }
  .dot.on { background: #2ecc71; }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; flex-direction: column; max-width: min(760px, 92%); }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.agent { align-self: flex-start; align-items: flex-start; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .row.user .bubble { background: var(--user); border-color: #cddffb; }
  .row.agent .bubble { background: var(--agent); }
  .mention {
    color: var(--accent);
    background: rgba(47, 111, 235, .1);
    border-radius: 4px;
    padding: 0 3px;
    font-weight: 600;
  }

  .note { align-self: center; font-size: 12px; color: var(--err); max-width: min(760px, 92%); }
  .degraded {
    font-size: 12px;
    color: #8a6100;
    background: #fff7e6;
    border: 1px solid #f0c36d;
    border-radius: 6px;
    padding: 2px 8px;
    margin-top: 4px;
  }
  .typing { align-self: flex-start; font-size: 13px; color: var(--muted); font-style: italic; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  #input:focus { outline: 2px solid rgba(47, 111, 235, .35); border-color: var(--accent); }
  button[type=submit] {
    padding: 10px 20px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button[type=submit]:disabled { background: #a9c2ef; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Multi-Agent 聊天室</h1>
  <div class="rooms">
    <select id="roomSelect" title="切换房间"></select>
    <button id="newRoomBtn" type="button" class="mini" title="新建房间">＋ 新建</button>
    <button id="delRoomBtn" type="button" class="mini danger" title="删除当前房间（默认房间不可删）">删除</button>
  </div>
  <div id="agents" class="agents"></div>
  <div class="conn"><span id="dot" class="dot"></span><span id="connText">连接中…</span></div>
</header>

<main id="log" class="log"></main>

<form id="form" autocomplete="off">
  <input id="input" placeholder="发消息，用 @qwen 或 @kimi 召唤 Agent（点上面的芯片可快速插入）" />
  <button id="send" type="submit">发送</button>
</form>

<script>
(function () {
  'use strict';

  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var agentsBox = document.getElementById('agents');
  var dot = document.getElementById('dot');
  var connText = document.getElementById('connText');
  // 多房间改造（阶段 4）：房间切换器
  var roomSelect = document.getElementById('roomSelect');
  var newRoomBtn = document.getElementById('newRoomBtn');
  var delRoomBtn = document.getElementById('delRoomBtn');

  var ME = 'user';
  var DEFAULT_ROOM = 'room-default';
  var agentNames = [];
  var chips = {};
  var typing = {};   // agentName -> DOM 节点
  var rooms = [];    // /api/rooms 的缓存
  var ws = null;

  // 多房间改造（阶段 2）：当前房间来自 URL 的 ?room=，缺省用 room-default。
  // 断线重连必须沿用这个值，绝不能回退到默认房间（否则重连后就串到别的房间了）。
  var currentRoom = new URLSearchParams(location.search).get('room') || DEFAULT_ROOM;
  var roomValid = false;   // 房间不存在时置 false，用来掐掉无意义的重连循环

  // 消息文本来自 Agent 子进程，属于不可信输入：先整体转义，再叠加 @高亮
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderText(text) {
    var escaped = escapeHtml(text);
    if (!agentNames.length) return escaped;
    var re = new RegExp('@(' + agentNames.join('|') + ')\\b', 'gi');
    return escaped.replace(re, '<span class="mention">@$1</span>');
  }

  function clock(ts) {
    var d = new Date(ts);
    return d.toTimeString().slice(0, 8);
  }

  function addMessage(msg) {
    var row = document.createElement('div');
    var isUser = msg.from === 'user';
    row.className = 'row ' + (isUser ? 'user' : 'agent');

    var meta = document.createElement('div');
    meta.className = 'meta';
    var who = isUser ? (msg.sender || ME) : (msg.label || msg.agent);
    meta.textContent = who + ' · ' + clock(msg.ts)
      + (msg.ms ? ' · ' + (msg.ms / 1000).toFixed(1) + 's' : '')
      + (msg.ctx ? ' · 记忆 ' + msg.ctx + ' 条' : '');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderText(msg.text);

    row.appendChild(meta);
    row.appendChild(bubble);

    // 后端降级返回（CLI 挂住但已拿到输出）时如实标出来，不假装一切正常
    if (msg.degraded) {
      var warn = document.createElement('div');
      warn.className = 'degraded';
      warn.textContent = '\u26a0 ' + msg.degraded;
      row.appendChild(warn);
    }

    log.appendChild(row);
    scrollBottom();
  }

  function addNote(text) {
    var el = document.createElement('div');
    el.className = 'note';
    el.textContent = text;
    log.appendChild(el);
    scrollBottom();
  }

  function scrollBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function setTyping(agent, on) {
    if (on) {
      if (typing[agent]) return;
      var el = document.createElement('div');
      el.className = 'typing';
      el.textContent = (labelOf(agent)) + ' 正在思考…';
      log.appendChild(el);
      typing[agent] = el;
      scrollBottom();
    } else if (typing[agent]) {
      typing[agent].remove();
      delete typing[agent];
    }
    if (chips[agent]) chips[agent].className = 'chip' + (on ? ' busy' : '');
  }

  function labelOf(agent) {
    var chip = chips[agent];
    return chip ? chip.dataset.label : agent;
  }

  function handleEvent(ev) {
    // 多房间改造（阶段 2）：兜底过滤。后端已经按房间分组投递了，
    // 但切换房间/重连的瞬间仍可能收到上一个房间的在途事件，这里再挡一道。
    if (ev.roomId && ev.roomId !== currentRoom) return;

    if (ev.type === 'history') {
      log.innerHTML = '';
      (ev.messages || []).forEach(addMessage);
      return;
    }
    if (ev.type === 'message') { addMessage(ev); return; }
    if (ev.type === 'status') {
      if (ev.state === 'thinking') setTyping(ev.agent, true);
      if (ev.state === 'busy') addNote('[' + ev.agent + '] 正在处理上一条消息，本次调用已跳过');
      if (ev.state === 'error') {
        setTyping(ev.agent, false);
        addNote('[' + ev.agent + '] ' + ev.error);
        if (chips[ev.agent]) {
          chips[ev.agent].className = 'chip err';
          setTimeout(function () { if (chips[ev.agent]) chips[ev.agent].className = 'chip'; }, 4000);
        }
      }
      if (ev.state === 'idle') setTyping(ev.agent, false);
    }
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    // 多房间改造（阶段 2）：连的是 currentRoom；断线重连时这个值不变，
    // 所以不会悄悄退回默认房间。
    ws = new WebSocket(proto + '//' + location.host + '/ws?room=' + encodeURIComponent(currentRoom));

    ws.onopen = function () {
      dot.className = 'dot on';
      connText.textContent = '已连接';
      sendBtn.disabled = false;
    };
    ws.onmessage = function (e) {
      var ev;
      try { ev = JSON.parse(e.data); } catch (_) { return; }
      handleEvent(ev);
    };
    ws.onclose = function (ev) {
      dot.className = 'dot';
      sendBtn.disabled = true;

      // 4001 是后端自定义码，含义是「这个房间已被删除」（可能在别的窗口删的）。
      // 这时重连毫无意义——后端会对已不存在的房间一直回 400——所以直接回默认房间。
      if (ev && ev.code === 4001) {
        roomValid = false;
        connText.textContent = '房间已被删除';
        addNote('当前房间已被删除，正在回到默认房间…');
        setTimeout(function () {
          refreshRooms().then(function () { switchRoom(DEFAULT_ROOM, true); });
        }, 1000);
        return;
      }

      // 房间本身不存在也别重连：后端每次都回 400，重连只是无限刷屏
      if (!roomValid) {
        connText.textContent = '房间不存在，已停止重连';
        return;
      }
      connText.textContent = '已断开，重连中…';
      setTimeout(connect, 1500);
    };
    ws.onerror = function () { ws.close(); };
  }

  function loadAgents() {
    fetch('/api/agents')
      .then(function (r) { return r.json(); })
      .then(function (list) {
        agentsBox.innerHTML = '';
        chips = {};
        agentNames = list.map(function (a) { return a.name; });
        list.forEach(function (a) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = '@' + a.name;
          chip.dataset.label = a.label;
          chip.title = '插入 @' + a.name;
          chip.addEventListener('click', function () {
            input.value = (input.value ? input.value.replace(/\s+$/, '') + ' ' : '') + '@' + a.name + ' ';
            input.focus();
          });
          agentsBox.appendChild(chip);
          chips[a.name] = chip;
        });
      })
      .catch(function () { connText.textContent = '无法获取 Agent 列表'; });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'chat', text: text, sender: ME }));
    input.value = '';
  });

  // ==================== 多房间改造（阶段 4）：房间管理 ====================

  function loadRooms() {
    return fetch('/api/rooms').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function refreshRooms() {
    return loadRooms().then(function (list) {
      rooms = list;
      renderRoomSelect();
      return list;
    });
  }

  function renderRoomSelect() {
    roomSelect.innerHTML = '';
    rooms.forEach(function (r) {
      var opt = document.createElement('option');
      opt.value = r.id;
      // 名字和 id 一样就只显示一次，避免出现 "proj-a（proj-a）" 这种噪音
      opt.textContent = r.name === r.id ? r.id : r.name + '（' + r.id + '）';
      roomSelect.appendChild(opt);
    });
    roomSelect.value = currentRoom;
  }

  // 标签页标题、输入框提示、删除按钮可用性都跟着当前房间走
  function applyRoomChrome() {
    var found = null;
    rooms.forEach(function (r) { if (r.id === currentRoom) found = r; });
    var label = found ? found.name : currentRoom;
    document.title = label + ' · Multi-Agent 聊天室';
    input.placeholder = '在「' + label + '」里发消息，用 @qwen 或 @kimi 召唤 Agent';
    delRoomBtn.disabled = (currentRoom === DEFAULT_ROOM);
    roomSelect.value = currentRoom;
  }

  // 切房间必须先主动关掉旧连接：否则旧房间的在途事件还会往这个页面推，
  // 而且旧连接的 onclose 会触发重连，等于同时挂着两个房间。
  function switchRoom(roomId, force) {
    if (roomId === currentRoom && !force) return;
    dropSocket();
    currentRoom = roomId;
    roomValid = true;
    history.replaceState(null, '', '?room=' + encodeURIComponent(roomId));
    log.innerHTML = '';
    typing = {};
    // 上一个房间遗留的「思考中」状态要清掉，否则芯片会一直显示忙
    Object.keys(chips).forEach(function (k) { chips[k].className = 'chip'; });
    connText.textContent = '连接中…';
    applyRoomChrome();
    connect();
  }

  // 摘掉 onclose 再关闭：这次关闭是我们主动的，不该被当成断线而触发重连
  function dropSocket() {
    if (!ws) return;
    var old = ws;
    ws = null;
    old.onclose = null;
    try { old.close(); } catch (_) {}
  }

  // 与后端 slugify 保持一致，只用来判断「中文名要不要额外问一个 ID」
  function slugify(name) {
    var s = String(name).toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 63);
    return (/^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$/.test(s) && s.length >= 2) ? s : '';
  }

  function api(method, url, body) {
    return fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().then(
        function (j) { return { ok: r.ok, status: r.status, body: j }; },
        function () { return { ok: r.ok, status: r.status, body: {} }; }
      );
    });
  }

  function createRoom() {
    var name = window.prompt('新房间的名称（显示用，可以是中文）：');
    if (name === null) return;
    name = name.trim();
    if (!name) { addNote('房间名不能为空'); return; }

    var payload = { name: name };
    // 纯中文名剥掉 CJK 后 slug 就空了，后端只能退化成 room-N，所以这里让用户自己定 ID
    if (!slugify(name)) {
      var id = window.prompt('中文名没法自动生成 ID，请给一个英文 ID（小写字母 / 数字 / 连字符）：');
      if (id === null) return;
      id = id.trim().toLowerCase();
      // 已经合法就原样用；否则规范化一次（"Proj C" -> "proj-c"），省得被后端 400 打回
      var clean = /^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$/.test(id) ? id : slugify(id);
      if (!clean) {
        addNote('ID 非法：只允许小写字母、数字和连字符，且不能以连字符开头或结尾');
        return;
      }
      payload.id = clean;
    }

    api('POST', '/api/rooms', payload).then(function (res) {
      if (!res.ok) {
        addNote('新建房间失败（HTTP ' + res.status + '）：' + (res.body.error || '未知错误'));
        return;
      }
      return refreshRooms().then(function () { switchRoom(res.body.id, true); });
    }).catch(function (e) { addNote('新建房间失败：' + e.message); });
  }

  function deleteRoom() {
    if (currentRoom === DEFAULT_ROOM) return;
    var sure = window.confirm(
      '确定删除房间「' + currentRoom + '」？\n\n'
      + '会一并删除：\n'
      + '  · 该房间的全部聊天历史\n'
      + '  · workspaces/' + currentRoom + '/ 目录下的所有文件\n\n'
      + '不可恢复。'
    );
    if (!sure) return;

    // 先自己断开：后端删除时会用 4001 关掉本房间连接，那条路径也会触发「回默认房间」，
    // 不先摘掉就会和下面这次主动切换撞车，结果同时开两条连接。
    dropSocket();
    roomValid = false;

    api('DELETE', '/api/rooms/' + encodeURIComponent(currentRoom)).then(function (res) {
      if (!res.ok) {
        addNote('删除失败（HTTP ' + res.status + '）：' + (res.body.error || '未知错误'));
        roomValid = true;
        connect(); // 删除没成功，人还留在这个房间，把连接接回来
        return;
      }
      return refreshRooms().then(function () { switchRoom(DEFAULT_ROOM, true); });
    }).catch(function (e) {
      addNote('删除失败：' + e.message);
      roomValid = true;
      connect();
    });
  }

  roomSelect.addEventListener('change', function () { switchRoom(roomSelect.value); });
  newRoomBtn.addEventListener('click', createRoom);
  delRoomBtn.addEventListener('click', deleteRoom);

  function boot() {
    loadAgents();

    refreshRooms()
      .then(function (list) {
        var exists = false;
        list.forEach(function (r) { if (r.id === currentRoom) exists = true; });

        // URL 指向的房间不存在时不要死连（后端会一直回 400），落回默认房间
        if (!exists) {
          addNote('房间「' + currentRoom + '」不存在，已回到默认房间。');
          currentRoom = DEFAULT_ROOM;
          history.replaceState(null, '', '?room=' + encodeURIComponent(currentRoom));
        }

        roomValid = true;
        log.innerHTML = '';
        applyRoomChrome();
        connect();
      })
      .catch(function (err) {
        dot.className = 'dot';
        connText.textContent = '无法获取房间列表';
        addNote('拉取房间列表失败：' + err.message);
      });
  }

  boot();
})();
</script>
</body>
</html>
