<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent 聊天室</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1c1f23;
    --muted: #6b7280;
    --accent: #2f6feb;
    --user: #e8f0fe;
    --agent: #ffffff;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .agents { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border);
    background: #fafbfc;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.busy { background: #fff7e6; border-color: #f0c36d; color: #8a6100; cursor: default; }
  .chip.err { background: #fdecea; border-color: #e6a99f; color: var(--err); cursor: default; }
  .conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9ced6; }
  .dot.on { background: #2ecc71; }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; flex-direction: column; max-width: min(760px, 92%); }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.agent { align-self: flex-start; align-items: flex-start; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .row.user .bubble { background: var(--user); border-color: #cddffb; }
  .row.agent .bubble { background: var(--agent); }
  .mention {
    color: var(--accent);
    background: rgba(47, 111, 235, .1);
    border-radius: 4px;
    padding: 0 3px;
    font-weight: 600;
  }

  .note { align-self: center; font-size: 12px; color: var(--err); max-width: min(760px, 92%); }
  .degraded {
    font-size: 12px;
    color: #8a6100;
    background: #fff7e6;
    border: 1px solid #f0c36d;
    border-radius: 6px;
    padding: 2px 8px;
    margin-top: 4px;
  }
  .typing { align-self: flex-start; font-size: 13px; color: var(--muted); font-style: italic; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  #input:focus { outline: 2px solid rgba(47, 111, 235, .35); border-color: var(--accent); }
  button[type=submit] {
    padding: 10px 20px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button[type=submit]:disabled { background: #a9c2ef; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Multi-Agent 聊天室</h1>
  <div id="agents" class="agents"></div>
  <div class="conn"><span id="dot" class="dot"></span><span id="connText">连接中…</span></div>
</header>

<main id="log" class="log"></main>

<form id="form" autocomplete="off">
  <input id="input" placeholder="发消息，用 @qwen 或 @kimi 召唤 Agent（点上面的芯片可快速插入）" />
  <button id="send" type="submit">发送</button>
</form>

<script>
(function () {
  'use strict';

  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var agentsBox = document.getElementById('agents');
  var dot = document.getElementById('dot');
  var connText = document.getElementById('connText');

  var ME = 'user';
  var agentNames = [];
  var chips = {};
  var typing = {};   // agentName -> DOM 节点
  var ws = null;

  // 消息文本来自 Agent 子进程，属于不可信输入：先整体转义，再叠加 @高亮
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderText(text) {
    var escaped = escapeHtml(text);
    if (!agentNames.length) return escaped;
    var re = new RegExp('@(' + agentNames.join('|') + ')\\b', 'gi');
    return escaped.replace(re, '<span class="mention">@$1</span>');
  }

  function clock(ts) {
    var d = new Date(ts);
    return d.toTimeString().slice(0, 8);
  }

  function addMessage(msg) {
    var row = document.createElement('div');
    var isUser = msg.from === 'user';
    row.className = 'row ' + (isUser ? 'user' : 'agent');

    var meta = document.createElement('div');
    meta.className = 'meta';
    var who = isUser ? (msg.sender || ME) : (msg.label || msg.agent);
    meta.textContent = who + ' · ' + clock(msg.ts) + (msg.ms ? ' · ' + (msg.ms / 1000).toFixed(1) + 's' : '');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderText(msg.text);

    row.appendChild(meta);
    row.appendChild(bubble);

    // 后端降级返回（CLI 挂住但已拿到输出）时如实标出来，不假装一切正常
    if (msg.degraded) {
      var warn = document.createElement('div');
      warn.className = 'degraded';
      warn.textContent = '\u26a0 ' + msg.degraded;
      row.appendChild(warn);
    }

    log.appendChild(row);
    scrollBottom();
  }

  function addNote(text) {
    var el = document.createElement('div');
    el.className = 'note';
    el.textContent = text;
    log.appendChild(el);
    scrollBottom();
  }

  function scrollBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function setTyping(agent, on) {
    if (on) {
      if (typing[agent]) return;
      var el = document.createElement('div');
      el.className = 'typing';
      el.textContent = (labelOf(agent)) + ' 正在思考…';
      log.appendChild(el);
      typing[agent] = el;
      scrollBottom();
    } else if (typing[agent]) {
      typing[agent].remove();
      delete typing[agent];
    }
    if (chips[agent]) chips[agent].className = 'chip' + (on ? ' busy' : '');
  }

  function labelOf(agent) {
    var chip = chips[agent];
    return chip ? chip.dataset.label : agent;
  }

  function handleEvent(ev) {
    if (ev.type === 'history') {
      log.innerHTML = '';
      (ev.messages || []).forEach(addMessage);
      return;
    }
    if (ev.type === 'message') { addMessage(ev); return; }
    if (ev.type === 'status') {
      if (ev.state === 'thinking') setTyping(ev.agent, true);
      if (ev.state === 'busy') addNote('[' + ev.agent + '] 正在处理上一条消息，本次调用已跳过');
      if (ev.state === 'error') {
        setTyping(ev.agent, false);
        addNote('[' + ev.agent + '] ' + ev.error);
        if (chips[ev.agent]) {
          chips[ev.agent].className = 'chip err';
          setTimeout(function () { if (chips[ev.agent]) chips[ev.agent].className = 'chip'; }, 4000);
        }
      }
      if (ev.state === 'idle') setTyping(ev.agent, false);
    }
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = function () {
      dot.className = 'dot on';
      connText.textContent = '已连接';
      sendBtn.disabled = false;
    };
    ws.onmessage = function (e) {
      var ev;
      try { ev = JSON.parse(e.data); } catch (_) { return; }
      handleEvent(ev);
    };
    ws.onclose = function () {
      dot.className = 'dot';
      connText.textContent = '已断开，重连中…';
      sendBtn.disabled = true;
      setTimeout(connect, 1500);
    };
    ws.onerror = function () { ws.close(); };
  }

  function loadAgents() {
    fetch('/api/agents')
      .then(function (r) { return r.json(); })
      .then(function (list) {
        agentsBox.innerHTML = '';
        chips = {};
        agentNames = list.map(function (a) { return a.name; });
        list.forEach(function (a) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = '@' + a.name;
          chip.dataset.label = a.label;
          chip.title = '插入 @' + a.name;
          chip.addEventListener('click', function () {
            input.value = (input.value ? input.value.replace(/\s+$/, '') + ' ' : '') + '@' + a.name + ' ';
            input.focus();
          });
          agentsBox.appendChild(chip);
          chips[a.name] = chip;
        });
      })
      .catch(function () { connText.textContent = '无法获取 Agent 列表'; });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'chat', text: text, sender: ME }));
    input.value = '';
  });

  loadAgents();
  connect();
})();
</script>
</body>
</html>
