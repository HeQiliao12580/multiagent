<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent 聊天室</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1c1f23;
    --muted: #6b7280;
    --accent: #2f6feb;
    --user: #e8f0fe;
    --agent: #ffffff;
    --err: #c0392b;
    /* 侧边栏：独立一套配色，想换成浅色侧边栏只改这几个变量 */
    --side-bg: #232a36;
    --side-bg-soft: #2c3543;
    --side-fg: #b6bfcd;
    --side-fg-strong: #ffffff;
    --side-border: #1a2029;
    --side-width: 250px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  /* 侧边栏：左右分栏骨架。整体锁死 100vh + overflow:hidden，
     滚动只发生在侧边栏房间列表和右侧消息区内部，不出现页面级滚动条。 */
  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .sidebar {
    width: var(--side-width);
    flex: none;                 /* 固定宽度，不被消息区挤压 */
    display: flex;
    flex-direction: column;
    background: var(--side-bg);
    border-right: 1px solid var(--side-border);
    min-height: 0;              /* 允许内部列表滚动而不是撑破容器 */
  }
  .main {
    flex: 1;
    min-width: 0;               /* 关键：不加这个 flex 子项不会收缩，长消息会把它撑宽 */
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* 侧边栏：顶部标题区 */
  .sidebar-head {
    padding: 16px 16px 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--side-fg-strong);
    letter-spacing: .3px;
    border-bottom: 1px solid var(--side-border);
    flex: none;
  }
  .sidebar-head .sub {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--side-fg);
    opacity: .7;
    margin-top: 2px;
  }
  /* 侧边栏：房间列表（独立滚动） */
  .room-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 0;
  }
  .room-list-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--side-fg);
    opacity: .6;
    padding: 4px 8px 8px;
  }
  /* 侧边栏：单个房间条目 */
  .room-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    border-left: 3px solid transparent;
    color: var(--side-fg);
    font-size: 14px;
    cursor: pointer;
    transition: background .12s, color .12s;
    user-select: none;
  }
  .room-item:hover { background: var(--side-bg-soft); color: var(--side-fg-strong); }
  /* 侧边栏：当前选中房间 —— 左侧色条 + 高亮底色 + 加粗 */
  .room-item.active {
    background: var(--side-bg-soft);
    border-left-color: var(--accent);
    color: var(--side-fg-strong);
    font-weight: 600;
  }
  .room-item .room-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .room-item .room-count {
    flex: none;
    font-size: 11px;
    color: var(--side-fg);
    opacity: .65;
    background: rgba(255, 255, 255, .07);
    border-radius: 999px;
    padding: 0 7px;
    line-height: 18px;
  }
  /* 侧边栏：列表为空 / 加载失败的兜底提示 */
  .room-list-msg {
    padding: 10px;
    font-size: 13px;
    color: var(--side-fg);
    opacity: .75;
    line-height: 1.5;
  }
  .room-list-msg button {
    font: inherit;
    font-size: 12px;
    margin-top: 8px;
    padding: 4px 10px;
    border: 1px solid var(--side-fg);
    border-radius: 6px;
    background: transparent;
    color: var(--side-fg-strong);
    cursor: pointer;
  }
  .room-list-msg button:hover { border-color: var(--accent); color: var(--accent); }
  /* 侧边栏：底部新建房间按钮 */
  .sidebar-foot {
    flex: none;
    padding: 10px;
    border-top: 1px solid var(--side-border);
  }
  .new-room {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px dashed rgba(255, 255, 255, .25);
    border-radius: 6px;
    background: transparent;
    color: var(--side-fg);
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .new-room:hover {
    background: var(--side-bg-soft);
    border-color: var(--accent);
    color: var(--side-fg-strong);
  }

  /* 右侧主区顶栏（原来的裸 header 选择器改成类名，避免误伤侧边栏里的元素） */
  .main-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  /* 侧边栏：主区顶栏的当前房间名 */
  .room-title { font-size: 16px; margin: 0; font-weight: 600; }
  .room-title .rid {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    margin-left: 6px;
  }
  /* 多房间改造（阶段 4）：房间切换器 */
  .rooms { display: flex; align-items: center; gap: 6px; }
  #roomSelect {
    font: inherit;
    font-size: 13px;
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    max-width: 220px;
  }
  #roomSelect:focus { outline: 2px solid rgba(47, 111, 235, .35); }
  .mini {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fafbfc;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .mini.danger:hover { border-color: var(--err); color: var(--err); }
  .mini:disabled { opacity: .4; cursor: default; }
  .mini:disabled:hover { border-color: var(--border); color: var(--muted); }

  /* Agent 互 @（阶段 4）：协作进行中的横幅 + 消息上的召唤关系标注 */
  .chain-banner {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    background: #eef4ff;
    border-bottom: 1px solid #cddffb;
    font-size: 13px;
    color: #1f4fa3;
    flex: none;   /* 侧边栏：横幅不参与伸缩 */
  }
  .chain-banner.on { display: flex; }
  .chain-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  .chain-banner .mini { margin-left: auto; }
  .collab {
    font-size: 12px;
    color: #1f4fa3;
    background: #eef4ff;
    border: 1px solid #cddffb;
    border-radius: 6px;
    padding: 1px 8px;
    margin-top: 4px;
  }
  .agents { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border);
    background: #fafbfc;
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.busy { background: #fff7e6; border-color: #f0c36d; color: #8a6100; cursor: default; }
  .chip.err { background: #fdecea; border-color: #e6a99f; color: var(--err); cursor: default; }
  .conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9ced6; }
  .dot.on { background: #2ecc71; }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; flex-direction: column; max-width: min(760px, 92%); }
  .row.user { align-self: flex-end; align-items: flex-end; }
  .row.agent { align-self: flex-start; align-items: flex-start; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .row.user .bubble { background: var(--user); border-color: #cddffb; }
  .row.agent .bubble { background: var(--agent); }
  .mention {
    color: var(--accent);
    background: rgba(47, 111, 235, .1);
    border-radius: 4px;
    padding: 0 3px;
    font-weight: 600;
  }

  .note { align-self: center; font-size: 12px; color: var(--err); max-width: min(760px, 92%); }
  .degraded {
    font-size: 12px;
    color: #8a6100;
    background: #fff7e6;
    border: 1px solid #f0c36d;
    border-radius: 6px;
    padding: 2px 8px;
    margin-top: 4px;
  }
  .typing { align-self: flex-start; font-size: 13px; color: var(--muted); font-style: italic; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    flex: none;   /* 侧边栏：输入区固定高度，不参与伸缩，滚动只留给消息区 */
  }
  #input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  #input:focus { outline: 2px solid rgba(47, 111, 235, .35); border-color: var(--accent); }
  button[type=submit] {
    padding: 10px 20px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button[type=submit]:disabled { background: #a9c2ef; cursor: default; }
</style>
</head>
<body>
<!-- 侧边栏：左右分栏的最外层容器，高度锁死 100vh -->
<div class="app">

  <!-- 侧边栏：左侧房间导航 -->
  <aside class="sidebar">
    <!-- 侧边栏：顶部标题区 -->
    <div class="sidebar-head">
      agent 聊天室
      <span class="sub">Multi-Agent Chatroom</span>
    </div>

    <!-- 侧边栏：房间列表容器。阶段 1 只搭骨架不接数据，阶段 2 由 JS 填充 -->
    <nav id="roomList" class="room-list" aria-label="房间列表">
      <div class="room-list-msg">尚未加载房间列表</div>
    </nav>

    <!-- 侧边栏：底部新建房间按钮。沿用原来的 #newRoomBtn id，
         所以现有的 createRoom 点击逻辑在阶段 1 就继续生效，功能不断档 -->
    <div class="sidebar-foot">
      <button id="newRoomBtn" type="button" class="new-room" title="新建房间">＋ 新建房间</button>
    </div>
  </aside>

  <!-- 右侧：聊天主区域 -->
  <main class="main">
    <header class="main-head">
      <!-- 侧边栏：当前房间名。阶段 1 先占位，阶段 3 起由 JS 跟随切换更新 -->
      <h1 class="room-title" id="roomTitle">Multi-Agent 聊天室</h1>

      <!-- 阶段 3 会移除这个下拉框（改由左侧列表切换）；阶段 1 先保留，保证切换功能不断档 -->
      <div class="rooms">
        <select id="roomSelect" title="切换房间"></select>
        <button id="delRoomBtn" type="button" class="mini danger" title="删除当前房间（默认房间不可删）">删除</button>
      </div>

      <div id="agents" class="agents"></div>
      <div class="conn"><span id="dot" class="dot"></span><span id="connText">连接中…</span></div>
    </header>

    <!-- Agent 互 @（阶段 4）：协作链进行中才显示，附带手动掐断的开关 -->
    <div id="chainBanner" class="chain-banner">
      <span class="chain-dot"></span>
      <span id="chainText">协作中…</span>
      <button id="stopChainBtn" type="button" class="mini danger" title="终止本房间正在进行的 Agent 协作链">停止协作</button>
    </div>

    <!-- 侧边栏：消息区从 <main> 降级成 <div>，因为 <main> 现在指的是右侧整列 -->
    <div id="log" class="log"></div>

    <form id="form" autocomplete="off">
      <input id="input" placeholder="发消息，用 @qwen 或 @kimi 召唤 Agent（点上面的芯片可快速插入）" />
      <button id="send" type="submit">发送</button>
    </form>
  </main>
</div>

<script>
(function () {
  'use strict';

  var log = document.getElementById('log');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var agentsBox = document.getElementById('agents');
  var dot = document.getElementById('dot');
  var connText = document.getElementById('connText');
  // 多房间改造（阶段 4）：房间切换器
  var roomSelect = document.getElementById('roomSelect');
  var newRoomBtn = document.getElementById('newRoomBtn');
  var delRoomBtn = document.getElementById('delRoomBtn');
  // Agent 互 @（阶段 4）：协作横幅与停止按钮
  var chainBanner = document.getElementById('chainBanner');
  var chainText = document.getElementById('chainText');
  var stopChainBtn = document.getElementById('stopChainBtn');
  // 侧边栏：左侧房间列表容器
  var roomList = document.getElementById('roomList');

  var ME = 'user';
  var DEFAULT_ROOM = 'room-default';
  var agentNames = [];
  var chips = {};
  var typing = {};   // agentName -> DOM 节点
  var rooms = [];    // /api/rooms 的缓存
  var ws = null;

  // Agent 互 @（阶段 4）
  var chainState = {};   // agentName -> depth，只统计 depth>0 的在跑调用
  var lastHandoff = null; // { from, to }，用来把「kimi 交回给 qwen」这类关系说清楚

  // 侧边栏：记住上次所在的房间。优先级 URL ?room= > localStorage > room-default
  var STORAGE_KEY = 'multiagent.currentRoom';
  function rememberedRoom() {
    // Safari 隐私模式等场景下访问 localStorage 会直接抛异常，必须兜住
    try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (_) { return ''; }
  }
  function rememberRoom(id) {
    try { localStorage.setItem(STORAGE_KEY, id); } catch (_) { /* 存不下就算了，不影响使用 */ }
  }
  function syncUrl() {
    history.replaceState(null, '', '?room=' + encodeURIComponent(currentRoom));
  }

  // 多房间改造（阶段 2）：断线重连必须沿用这个值，绝不能回退到默认房间
  var currentRoom = new URLSearchParams(location.search).get('room') || rememberedRoom() || DEFAULT_ROOM;
  var roomValid = false;   // 房间不存在时置 false，用来掐掉无意义的重连循环

  // 消息文本来自 Agent 子进程，属于不可信输入：先整体转义，再叠加 @高亮
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderText(text) {
    var escaped = escapeHtml(text);
    if (!agentNames.length) return escaped;
    var re = new RegExp('@(' + agentNames.join('|') + ')\\b', 'gi');
    return escaped.replace(re, '<span class="mention">@$1</span>');
  }

  function clock(ts) {
    var d = new Date(ts);
    return d.toTimeString().slice(0, 8);
  }

  function addMessage(msg) {
    var row = document.createElement('div');
    var isUser = msg.from === 'user';
    row.className = 'row ' + (isUser ? 'user' : 'agent');

    var meta = document.createElement('div');
    meta.className = 'meta';
    var who = isUser ? (msg.sender || ME) : (msg.label || msg.agent);
    meta.textContent = who + ' · ' + clock(msg.ts)
      + (msg.ms ? ' · ' + (msg.ms / 1000).toFixed(1) + 's' : '')
      + (msg.ctx ? ' · 记忆 ' + msg.ctx + ' 条' : '');

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderText(msg.text);

    row.appendChild(meta);
    row.appendChild(bubble);

    // Agent 互 @（阶段 4）：把召唤关系明确标出来，让用户一眼看出这是 Agent 之间的
    // 协作、而不是用户发的消息。
    if (!isUser) {
      var rel = [];
      if (msg.triggeredBy === 'agent_mention') {
        // 谁召唤的它：取上一条带 mentions 的消息。history 重放是按顺序走的，
        // 所以刷新页面后这个关系依然能重建出来。
        var caller = (lastHandoff && lastHandoff.to === msg.agent) ? labelOf(lastHandoff.from) : '同伴';
        rel.push(caller + ' 召唤了 ' + (msg.label || msg.agent) + '（协作第 ' + (msg.depth || 0) + ' 轮）');
      }
      if (msg.mentions && msg.mentions.length) {
        rel.push((msg.label || msg.agent) + ' 召唤了 ' + msg.mentions.map(labelOf).join('、'));
        lastHandoff = { from: msg.agent, to: msg.mentions[0] };
      }
      if (rel.length) {
        var badge = document.createElement('div');
        badge.className = 'collab';
        badge.textContent = '\u21c4 ' + rel.join(' · ');
        row.appendChild(badge);
      }
    }

    // 后端降级返回（CLI 挂住但已拿到输出）时如实标出来，不假装一切正常
    if (msg.degraded) {
      var warn = document.createElement('div');
      warn.className = 'degraded';
      warn.textContent = '\u26a0 ' + msg.degraded;
      row.appendChild(warn);
    }

    // Agent 互 @（阶段 2）：链条被 MAX_DEPTH 截断时要明确讲出来，
    // 否则用户只看到「派活了但没人接」，会以为系统坏了。
    if (msg.depthLimited) {
      var limited = document.createElement('div');
      limited.className = 'degraded';
      limited.textContent = '\u26a0 协作轮数已达上限，链条在此截断';
      row.appendChild(limited);
    }

    log.appendChild(row);
    scrollBottom();
  }

  function addNote(text) {
    var el = document.createElement('div');
    el.className = 'note';
    el.textContent = text;
    log.appendChild(el);
    scrollBottom();
  }

  function scrollBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function setTyping(agent, on, depth) {
    if (on) {
      // Agent 互 @（阶段 4）：depth>0 说明这一环是同伴召唤出来的，计入协作横幅
      if (depth > 0) chainState[agent] = depth;
      if (typing[agent]) { updateChainBanner(); return; }
      var el = document.createElement('div');
      el.className = 'typing';
      el.textContent = labelOf(agent)
        + (depth > 0 ? ' 正在思考…（协作第 ' + depth + ' 轮）' : ' 正在思考…');
      log.appendChild(el);
      typing[agent] = el;
      scrollBottom();
    } else {
      delete chainState[agent];
      if (typing[agent]) { typing[agent].remove(); delete typing[agent]; }
    }
    if (chips[agent]) chips[agent].className = 'chip' + (on ? ' busy' : '');
    updateChainBanner();
  }

  // Agent 互 @（阶段 4）：只要有 depth>0 的调用在跑，就说明协作链还没结束
  function updateChainBanner() {
    var active = Object.keys(chainState);
    if (!active.length) {
      chainBanner.className = 'chain-banner';
      stopChainBtn.disabled = false; // 复位，下次协作还能按
      return;
    }
    var maxDepth = 0;
    active.forEach(function (a) { if (chainState[a] > maxDepth) maxDepth = chainState[a]; });
    chainText.textContent = '协作中… 第 ' + maxDepth + ' 轮（'
      + active.map(labelOf).join('、') + ' 正在处理）';
    chainBanner.className = 'chain-banner on';
  }

  // 切房间 / 终止协作时，把横幅、思考中指示器、芯片状态一起清干净，
  // 否则上一个房间的「协作中」会一直挂着
  function resetChainUi() {
    chainState = {};
    lastHandoff = null;
    Object.keys(typing).forEach(function (k) { typing[k].remove(); delete typing[k]; });
    Object.keys(chips).forEach(function (k) { chips[k].className = 'chip'; });
    updateChainBanner();
  }

  function labelOf(agent) {
    var chip = chips[agent];
    return chip ? chip.dataset.label : agent;
  }

  function handleEvent(ev) {
    // 多房间改造（阶段 2）：兜底过滤。后端已经按房间分组投递了，
    // 但切换房间/重连的瞬间仍可能收到上一个房间的在途事件，这里再挡一道。
    if (ev.roomId && ev.roomId !== currentRoom) return;

    if (ev.type === 'history') {
      log.innerHTML = '';
      (ev.messages || []).forEach(addMessage);
      return;
    }
    // Agent 互 @（阶段 2）：后端把消息类型拆成了 user_message / agent_message，
    // 但旧历史里存的还是 message —— 三种都要能渲染，否则老房间的对话会整体消失。
    if (ev.type === 'message' || ev.type === 'user_message' || ev.type === 'agent_message') {
      addMessage(ev);
      return;
    }
    // Agent 互 @（阶段 4）：后端确认协作链已终止
    if (ev.type === 'chain_stopped') {
      resetChainUi();
      addNote('协作已终止' + (ev.killed ? '（中断了 ' + ev.killed + ' 个正在跑的调用）' : ''));
      return;
    }

    if (ev.type === 'status') {
      if (ev.state === 'thinking') setTyping(ev.agent, true, ev.depth || 0);
      if (ev.state === 'busy') addNote('[' + ev.agent + '] 正在处理上一条消息，本次调用已跳过'
        // Agent 互 @：协作链撞上并发闸会静默断掉，必须讲明原因
        + (ev.triggeredBy === 'agent_mention' ? '（协作链在此中断）' : ''));
      // Agent 互 @（阶段 4）：用户主动按了「停止协作」，不是故障，别用红色报错样式
      if (ev.state === 'aborted') {
        setTyping(ev.agent, false);
        addNote('[' + labelOf(ev.agent) + '] ' + ev.error);
      }
      if (ev.state === 'error') {
        setTyping(ev.agent, false);
        addNote('[' + ev.agent + '] ' + ev.error);
        if (chips[ev.agent]) {
          chips[ev.agent].className = 'chip err';
          setTimeout(function () { if (chips[ev.agent]) chips[ev.agent].className = 'chip'; }, 4000);
        }
      }
      if (ev.state === 'idle') setTyping(ev.agent, false);
    }
  }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    // 多房间改造（阶段 2）：连的是 currentRoom；断线重连时这个值不变，
    // 所以不会悄悄退回默认房间。
    ws = new WebSocket(proto + '//' + location.host + '/ws?room=' + encodeURIComponent(currentRoom));

    ws.onopen = function () {
      dot.className = 'dot on';
      connText.textContent = '已连接';
      sendBtn.disabled = false;
    };
    ws.onmessage = function (e) {
      var ev;
      try { ev = JSON.parse(e.data); } catch (_) { return; }
      handleEvent(ev);
    };
    ws.onclose = function (ev) {
      dot.className = 'dot';
      sendBtn.disabled = true;

      // 4001 是后端自定义码，含义是「这个房间已被删除」（可能在别的窗口删的）。
      // 这时重连毫无意义——后端会对已不存在的房间一直回 400——所以直接回默认房间。
      if (ev && ev.code === 4001) {
        roomValid = false;
        connText.textContent = '房间已被删除';
        addNote('当前房间已被删除，正在回到默认房间…');
        setTimeout(function () {
          refreshRooms().then(function () { switchRoom(DEFAULT_ROOM, true); });
        }, 1000);
        return;
      }

      // 房间本身不存在也别重连：后端每次都回 400，重连只是无限刷屏
      if (!roomValid) {
        connText.textContent = '房间不存在，已停止重连';
        return;
      }
      connText.textContent = '已断开，重连中…';
      setTimeout(connect, 1500);
    };
    ws.onerror = function () { ws.close(); };
  }

  function loadAgents() {
    fetch('/api/agents')
      .then(function (r) { return r.json(); })
      .then(function (list) {
        agentsBox.innerHTML = '';
        chips = {};
        agentNames = list.map(function (a) { return a.name; });
        list.forEach(function (a) {
          var chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.textContent = '@' + a.name;
          chip.dataset.label = a.label;
          chip.title = '插入 @' + a.name;
          chip.addEventListener('click', function () {
            input.value = (input.value ? input.value.replace(/\s+$/, '') + ' ' : '') + '@' + a.name + ' ';
            input.focus();
          });
          agentsBox.appendChild(chip);
          chips[a.name] = chip;
        });
      })
      .catch(function () { connText.textContent = '无法获取 Agent 列表'; });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'chat', text: text, sender: ME }));
    input.value = '';
  });

  // ==================== 多房间改造（阶段 4）：房间管理 ====================

  function loadRooms() {
    return fetch('/api/rooms').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function refreshRooms() {
    return loadRooms().then(function (list) {
      rooms = list;
      renderRoomSelect();
      renderRoomList();   // 侧边栏
      return list;
    });
  }

  // 侧边栏：列表区的兜底提示（空列表 / 加载失败）。传 onRetry 时附一个「点击重试」按钮。
  function listMsg(text, onRetry) {
    var box = document.createElement('div');
    box.className = 'room-list-msg';
    box.textContent = text;
    if (onRetry) {
      box.appendChild(document.createElement('br'));
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = '点击重试';
      btn.addEventListener('click', onRetry);
      box.appendChild(btn);
    }
    return box;
  }

  // 侧边栏：把房间列表渲染到左侧，当前房间加 .active 高亮。
  // 每次都整体重绘而不是增量更新 —— 房间数量是个位数到几十的量级，重绘成本可以忽略，
  // 换来的是「高亮、徽标、顺序」永远和 rooms 数组一致，不会出现增量更新漏改的状态。
  function renderRoomList() {
    roomList.innerHTML = '';

    if (!rooms.length) {
      roomList.appendChild(listMsg('还没有任何房间。点下面的「＋ 新建房间」建一个。'));
      return;
    }

    var label = document.createElement('div');
    label.className = 'room-list-label';
    label.textContent = '房间 · ' + rooms.length;
    roomList.appendChild(label);

    rooms.forEach(function (r) {
      var item = document.createElement('div');
      item.className = 'room-item' + (r.id === currentRoom ? ' active' : '');
      item.dataset.room = r.id;
      item.title = r.name === r.id ? r.id : r.name + '（' + r.id + '）';
      // 用 div + role 而不是 <a>：切换房间不换页面，语义上是按钮
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');

      var name = document.createElement('span');
      name.className = 'room-name';
      name.textContent = r.name === r.id ? r.id : r.name;
      item.appendChild(name);

      if (r.messageCount) {
        var badge = document.createElement('span');
        badge.className = 'room-count';
        badge.textContent = r.messageCount;
        badge.title = r.messageCount + ' 条消息';
        item.appendChild(badge);
      }

      item.addEventListener('click', function () { switchRoom(r.id); });
      // 键盘可达性：Tab 聚焦后 Enter / 空格等同点击
      item.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); switchRoom(r.id); }
      });

      roomList.appendChild(item);
    });
  }

  function renderRoomSelect() {
    roomSelect.innerHTML = '';
    rooms.forEach(function (r) {
      var opt = document.createElement('option');
      opt.value = r.id;
      // 名字和 id 一样就只显示一次，避免出现 "proj-a（proj-a）" 这种噪音
      opt.textContent = r.name === r.id ? r.id : r.name + '（' + r.id + '）';
      roomSelect.appendChild(opt);
    });
    roomSelect.value = currentRoom;
  }

  // 标签页标题、输入框提示、删除按钮可用性都跟着当前房间走
  function applyRoomChrome() {
    var found = null;
    rooms.forEach(function (r) { if (r.id === currentRoom) found = r; });
    var label = found ? found.name : currentRoom;
    document.title = label + ' · Multi-Agent 聊天室';
    input.placeholder = '在「' + label + '」里发消息，用 @qwen 或 @kimi 召唤 Agent';
    delRoomBtn.disabled = (currentRoom === DEFAULT_ROOM);
    roomSelect.value = currentRoom;
    renderRoomList();   // 侧边栏：高亮必须跟着当前房间走
  }

  // 切房间必须先主动关掉旧连接：否则旧房间的在途事件还会往这个页面推，
  // 而且旧连接的 onclose 会触发重连，等于同时挂着两个房间。
  function switchRoom(roomId, force) {
    if (roomId === currentRoom && !force) return;
    dropSocket();
    currentRoom = roomId;
    roomValid = true;
    syncUrl();          // 侧边栏：地址栏跟着变，刷新后仍留在同一房间
    rememberRoom(roomId); // 侧边栏：记住选择，下次打开直接回到这个房间
    // 上一个房间的协作状态（横幅、思考中指示、芯片高亮）必须一起清掉，
    // 否则切走了还挂着「协作中…」
    resetChainUi();
    log.innerHTML = '';
    connText.textContent = '连接中…';
    applyRoomChrome();
    connect();
  }

  // 摘掉 onclose 再关闭：这次关闭是我们主动的，不该被当成断线而触发重连
  function dropSocket() {
    if (!ws) return;
    var old = ws;
    ws = null;
    old.onclose = null;
    try { old.close(); } catch (_) {}
  }

  // 与后端 slugify 保持一致，只用来判断「中文名要不要额外问一个 ID」
  function slugify(name) {
    var s = String(name).toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 63);
    return (/^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$/.test(s) && s.length >= 2) ? s : '';
  }

  function api(method, url, body) {
    return fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().then(
        function (j) { return { ok: r.ok, status: r.status, body: j }; },
        function () { return { ok: r.ok, status: r.status, body: {} }; }
      );
    });
  }

  function createRoom() {
    var name = window.prompt('新房间的名称（显示用，可以是中文）：');
    if (name === null) return;
    name = name.trim();
    if (!name) { addNote('房间名不能为空'); return; }

    var payload = { name: name };
    // 纯中文名剥掉 CJK 后 slug 就空了，后端只能退化成 room-N，所以这里让用户自己定 ID
    if (!slugify(name)) {
      var id = window.prompt('中文名没法自动生成 ID，请给一个英文 ID（小写字母 / 数字 / 连字符）：');
      if (id === null) return;
      id = id.trim().toLowerCase();
      // 已经合法就原样用；否则规范化一次（"Proj C" -> "proj-c"），省得被后端 400 打回
      var clean = /^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$/.test(id) ? id : slugify(id);
      if (!clean) {
        addNote('ID 非法：只允许小写字母、数字和连字符，且不能以连字符开头或结尾');
        return;
      }
      payload.id = clean;
    }

    api('POST', '/api/rooms', payload).then(function (res) {
      if (!res.ok) {
        addNote('新建房间失败（HTTP ' + res.status + '）：' + (res.body.error || '未知错误'));
        return;
      }
      return refreshRooms().then(function () { switchRoom(res.body.id, true); });
    }).catch(function (e) { addNote('新建房间失败：' + e.message); });
  }

  function deleteRoom() {
    if (currentRoom === DEFAULT_ROOM) return;
    var sure = window.confirm(
      '确定删除房间「' + currentRoom + '」？\n\n'
      + '会一并删除：\n'
      + '  · 该房间的全部聊天历史\n'
      + '  · workspaces/' + currentRoom + '/ 目录下的所有文件\n\n'
      + '不可恢复。'
    );
    if (!sure) return;

    // 先自己断开：后端删除时会用 4001 关掉本房间连接，那条路径也会触发「回默认房间」，
    // 不先摘掉就会和下面这次主动切换撞车，结果同时开两条连接。
    dropSocket();
    roomValid = false;

    api('DELETE', '/api/rooms/' + encodeURIComponent(currentRoom)).then(function (res) {
      if (!res.ok) {
        addNote('删除失败（HTTP ' + res.status + '）：' + (res.body.error || '未知错误'));
        roomValid = true;
        connect(); // 删除没成功，人还留在这个房间，把连接接回来
        return;
      }
      return refreshRooms().then(function () { switchRoom(DEFAULT_ROOM, true); });
    }).catch(function (e) {
      addNote('删除失败：' + e.message);
      roomValid = true;
      connect();
    });
  }

  roomSelect.addEventListener('change', function () { switchRoom(roomSelect.value); });
  newRoomBtn.addEventListener('click', createRoom);
  delRoomBtn.addEventListener('click', deleteRoom);

  // Agent 互 @（阶段 4）：终止本房间的协作链。
  // 不带 roomId —— 后端用的是握手时校验过的连接所属房间，
  // 所以客户端无法借这个控制消息去终止别的房间。
  stopChainBtn.addEventListener('click', function () {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'stop_chain' }));
    stopChainBtn.disabled = true;
    chainText.textContent = '正在终止协作…';
  });

  // 侧边栏：启动流程 —— 拉房间列表 → 渲染侧边栏 → 定位初始房间 → 连 WebSocket
  function boot() {
    loadAgents();
    loadRoomList();
  }

  function loadRoomList() {
    refreshRooms()
      .then(function (list) {
        // 后端保证 room-default 一定存在，所以正常不会走到这个分支；
        // 但万一房间被清空，也得给出可读提示而不是白屏
        if (!list.length) {
          roomValid = false;
          dot.className = 'dot';
          connText.textContent = '无可用房间';
          addNote('后端没有任何房间，请先新建一个。');
          return;
        }

        var exists = list.some(function (r) { return r.id === currentRoom; });
        if (!exists) {
          // 坑 5：localStorage / URL 里记住的房间可能已经被删掉了，
          // 回退到列表里第一个可用房间（列表按 createdAt 升序，第一个就是最早的）
          var fallback = list[0].id;
          addNote('房间「' + currentRoom + '」不存在（可能已被删除），已切到「' + fallback + '」。');
          currentRoom = fallback;
          rememberRoom(currentRoom);
          syncUrl();
        }

        roomValid = true;
        log.innerHTML = '';
        applyRoomChrome();  // 内部会 renderRoomList()，高亮随之落位
        connect();
      })
      .catch(function (err) {
        // 坑 3：列表加载失败不能只留一个空白侧边栏，要给原因 + 重试入口
        dot.className = 'dot';
        connText.textContent = '房间列表加载失败';
        sendBtn.disabled = true;
        rooms = [];
        roomList.innerHTML = '';
        roomList.appendChild(listMsg('加载房间失败：' + err.message, loadRoomList));
      });
  }

  boot();
})();
</script>
</body>
</html>
